[project]
name = "build-an-agent"
version = "0.1.0"
description = "A minimal coding agent on Amazon Bedrock, used as a workshop exercise."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.11.0",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "D", "PT"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
