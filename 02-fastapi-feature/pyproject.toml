[project]
name = "fare-watch"
version = "0.1.0"
description = "A small FastAPI service on top of the Hermes flight-price API, used as a workshop exercise."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.fastapi]
entrypoint = "fare_watch.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "D", "FAST", "PT"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
