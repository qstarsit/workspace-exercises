[project]
name = "ftw"
version = "0.1.0"
description = "Distil a large model into a small local model for flight questions, used as a workshop exercise."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.0",
    "orjson>=3.11.0",
    "peft>=0.17.0",
    "torch>=2.8.0",
    "tqdm>=4.67.0",
    "transformers>=4.56.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]>=1.40.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-tqdm>=4.67.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "D", "PT"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["transformers.*", "peft.*", "huggingface_hub.*"]
ignore_missing_imports = true
